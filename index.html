<!DOCTYPE html>
<html lang = "en">
<head>
    <meta name = "description" content = "Nicole's website about her hobbies including plants and sparkles">
    <link rel = "stylesheet" href = "stylesheet.css"> 
    <title>Nicole's Website</title>
</head>
<body>
    <div id="intro">
        <h1 class = "highlight" > Nicole</h1>
        <p>My name is written above</p>
    </div>
    <div>
        <h2 class="highlight">Hobbies</h2>
        <p>I love plants and sparkles</p>
        <ul>
            <li>Dark Opal Basil</li>
            <li>Sweet Basil</li>
            <li>Genovese Basil</li>
        </ul>
        <details>
            <summary>Click for a surprise</summary>
            <p>You found a secret message!</p>
        </details>
        <br>

        <a href = "https://youtu.be/ONDEZiHOB7E?si=RAUTlakggt5rc6ou" >Heres a link to a video on plants</a>
        <br>

        <img src = "Genovese basil.jpg" alt = "A photo of a genoves basil plant">
        <br>
        <p>
            <label for="plantName">Name a Plant</label>
            <input type="text" id ="plantName" placeholder="For example Basil">
        </p>
        <br>

        <p>
            <label>
                <input type="checkbox" id="likesPlants">
                I like plants
            </label>
        </p>
        <button>Show me some sparkle</button>
        <p>
            <label for="plantChoice">Choose a Plant</label>
            <select id ="plantChoice">
                <option>Basil</option>
                <option>Mint</option>
                <option>Rosemary</option>
            </select>
        </p>
        <p>
            <label for="plantNotes"> Plant Notes</label>
            <br>
            <textarea id = "plantNotes" lines="4px"></textarea>
        </p>
    </div>
</body>
</html>
